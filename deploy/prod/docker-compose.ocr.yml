# prod OCR 워커 전용 EC2(brbs-ocr-prod, t3.large 스팟) 배포용 compose — 단일 진실원.
# 서버에서 수동 편집 금지, PR로 수정한다. 배포 워크플로(deploy-prod.yml)가 매번 이 파일로
# 호스트의 /opt/ocr/docker-compose.ocr.yml을 덮어쓴다.
# 사용: docker compose -f docker-compose.ocr.yml --env-file .env.ocr up -d
#
# 이 호스트에는 ocr-worker 하나만 둔다. GPU는 없다 — 글자 검출·인식(PaddleOCR)과 NER은 이 컨테이너가
# CPU로 직접 돌리고, 표·저신뢰도 보조 전사만 클러스터 vLLM(brbs-etl T4, PaddleOCR-VL)을 NodePort로
# 부른다. vLLM이 꺼져 있으면(brbs-etl stop) 5초 안에 접속을 포기하고 OCR 엔진 결과로 대체한다.
#
# 크기 근거(t3.large 8GB): 문서 1건 처리 최고 메모리가 A4 200dpi 3.85GB, 폰 사진 3.95GB다
# (PR #81 측정, OCR_DET_LIMIT_SIDE_LEN 상한 적용 후). t3.medium(4GB)은 OS 몫을 빼면 이보다 작다.
name: brbs-ocr

services:
  ocr-worker:
    # prod는 가변 태그(:dev)를 쓰지 않는다 — dev에서 검증한 :<sha7>을 배포 워크플로가 .env.ocr의
    # OCR_TAG에 기록한다. 비어 있으면 기동을 거부해 엉뚱한 이미지가 뜨지 않게 한다.
    image: ${ECR_REGISTRY}/brbs/ocr:${OCR_TAG:?set OCR_TAG (deployed sha7) in .env.ocr}
    container_name: brbs-ocr-worker
    restart: unless-stopped
    # 스팟 회수·재배포 때 SIGTERM 후 기다리는 시간. 워커는 진행 중인 롱폴링 1주기 뒤 멈추고,
    # 그 안에 못 끝낸 메시지는 삭제 전이라 가시성 타임아웃(600초) 뒤 재전달·멱등 재처리된다.
    # 회수 통지(2분) 안에 들어가도록 잡았다.
    stop_grace_period: 60s
    # 최고 3.95GB(위) + 여유. 이보다 커지면 호스트 OOM 대신 이 컨테이너만 재시작된다.
    mem_limit: 4608m
    mem_reservation: 2g
    environment:
      ENV: ${ENV:?set ENV=prod in .env.ocr}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # brbs_prod DB의 ai_owner_prod 롤(deploy/schema_split.sql을 prod 롤 이름으로 실행한 뒤).
      # 롤은 RDS 인스턴스 단위라 dev 롤(ai_owner)을 쓰면 dev 자격증명으로 prod를 건드리게 된다.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.ocr}
      # RDS는 SSL 연결만 허용(pg_hba). 비우면 core.db가 SSL을 꺼(평문) "no encryption"으로 거부된다.
      RDS_CA_PATH: /etc/ssl/rds/global-bundle.pem
      SQS_OCR_JOB_QUEUE_URL: ${SQS_OCR_JOB_QUEUE_URL:?set SQS_OCR_JOB_QUEUE_URL in .env.ocr}
      SQS_REPORT_JOB_QUEUE_URL: ${SQS_REPORT_JOB_QUEUE_URL:?set SQS_REPORT_JOB_QUEUE_URL in .env.ocr}
      # 비우면 코드 기본값(localhost:8000)으로 떨어져 VLM 호출이 전부 조용히 OCR 엔진 결과로 대체된다.
      VLM_BASE_URL: ${VLM_BASE_URL:?set VLM_BASE_URL in .env.ocr (brbs-etl NodePort)}
      # etl-vllm의 --served-model-name과 같아야 한다(다르면 404 → 매 호출 OCR 엔진 결과로 대체).
      VLM_MODEL: ${VLM_MODEL:-PaddleOCR-VL-1.6-0.9B}
      # 이름 마스킹은 정규식 문맥 앵커만으론 일반 라벨-값("환자의 성명: OOO")을 못 잡는다 — NER이
      # 유일한 방어선이라 끄지 않는다.
      USE_NER: ${USE_NER:-true}
      OCR_LOW_CONFIDENCE_THRESHOLD: ${OCR_LOW_CONFIDENCE_THRESHOLD:-0.90}
      # t3.large vCPU 수에 맞춘다(넘기면 스레드끼리 경합만 늘어난다).
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-2}
      OCR_DET_MODEL: ${OCR_DET_MODEL:-PP-OCRv5_server_det}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env.ocr}
      TZ: Asia/Seoul
    volumes:
      # RDS CA 번들 — 호스트 초기 설치(bootstrap-ocr-host.sh)가 받아 둔다.
      - /opt/ocr/certs/rds-global-bundle.pem:/etc/ssl/rds/global-bundle.pem:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [ocr-net]

networks:
  ocr-net:
    driver: bridge
