# GPU EC2(AI subnet) 배포용 compose — 단일 진실원. 서버에서 수동 편집 금지, PR로 수정.
# 사용: docker compose -f docker-compose.ocr.yml --env-file .env.ocr up -d
# CD는 ocr-worker만 bounce: ... up -d --no-deps ocr-worker
#
# VLM은 이 호스트에 띄우지 않는다 — 클러스터 vLLM(PaddleOCR-VL-1.6, K8s-manifests charts/etl-vllm)을
# VLM_BASE_URL로 부른다(예전 ollama 서비스·Qwen 모델 pull은 없어졌다). OCR을 k8s(brbs-etl)로
# 옮긴 뒤 이 compose는 제거한다. 이미 떠 있는 brbs-ollama 컨테이너는 CD(--no-deps)가 건드리지
# 않으므로, 다른 소비자가 없음을 확인한 뒤 호스트에서 직접 내린다.
#
# 전제: 호스트에 NVIDIA 드라이버 + nvidia-container-toolkit 설치됨(Deep Learning AMI 권장).
name: brbs-ocr

services:
  # OCR Worker(surya, in-process PyTorch). SQS ocr-job-queue 소비 → 결과 저장 → 리포트 이벤트 발행.
  ocr-worker:
    image: ${ECR_REGISTRY}/brbs/ocr:${OCR_TAG:-dev}
    container_name: brbs-ocr-worker
    restart: unless-stopped
    environment:
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}                       # RDS 직접
      # RDS는 SSL 연결만 허용(pg_hba). 비우면 core.db가 SSL을 꺼(평문) "no encryption"으로 거부됨.
      RDS_CA_PATH: ${RDS_CA_PATH}                          # 컨테이너 내부 CA 경로(아래 볼륨과 일치)
      SQS_OCR_JOB_QUEUE_URL: ${SQS_OCR_JOB_QUEUE_URL}        # 소비 큐 전체 URL(AWS SQS)
      SQS_REPORT_JOB_QUEUE_URL: ${SQS_REPORT_JOB_QUEUE_URL}  # 발행 큐 전체 URL
      # SQS_ENDPOINT_URL은 실 AWS에선 주입하지 않는다(기본 엔드포인트). 자격증명은
      # EC2 인스턴스 프로파일(IAM Role) — 정적 키 없음. 튜닝 변수(SQS_WAIT_TIME_SECONDS 등)는
      # 코드 기본값을 쓰므로 생략한다.
      # VLM(쪽 전사·라인 재판독, ocr_worker.vlm_client) — 클러스터 vLLM의 OpenAI 호환 엔드포인트.
      # 필수: 비우면 코드 기본값(localhost:8000)으로 떨어져 VLM 호출이 전부 조용히 surya 폴백한다.
      # 이 EC2는 클러스터 밖이라 Service DNS(http://vllm:8000)가 안 풀린다 — 클러스터 밖에서 닿는
      # 주소(내부 LB·NodePort 등)를 .env.ocr에 넣는다.
      VLM_BASE_URL: ${VLM_BASE_URL:?set VLM_BASE_URL in .env.ocr (cluster vLLM endpoint)}
      # etl-vllm의 --served-model-name과 같아야 한다(다르면 404 → 매 호출 surya 폴백).
      VLM_MODEL: ${VLM_MODEL:-PaddleOCR-VL-1.6-0.9B}
      # 타임아웃·토큰 상한·동시도·단계 예산은 코드 기본값(src/core/config.py VLM 섹션, SQS 가시성
      # 600초 안의 최악 경로 계산 포함)을 쓴다. 바꿔야 하면 .env.ocr에 VLM_* 로 넣고 여기 연결한다.
      # 이름(NAME) 마스킹은 정규식 문맥 앵커(의사명·서명란)만으로는 "환자의 성명: OOO"
      # 같은 일반 라벨-값 형태를 못 잡는다 — 실측(E2E) 확인. NER이 유일한 방어선이라
      # 기본 활성화한다(CPU 추론, 모델은 최초 detect 시 lazy 다운로드).
      USE_NER: ${USE_NER:-true}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      TZ: Asia/Seoul
    volumes:
      # RDS CA 번들(호스트에 배치, git 미커밋)을 읽기전용 마운트. RDS_CA_PATH가 이 경로를 가리킨다.
      # 준비: curl -o /opt/ocr/certs/rds-global-bundle.pem \
      #        https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
      - /opt/ocr/certs/rds-global-bundle.pem:/etc/ssl/rds/global-bundle.pem:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [ocr-net]

networks:
  ocr-net:
    driver: bridge

