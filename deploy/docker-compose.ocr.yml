# GPU EC2(AI subnet) 배포용 compose — 단일 진실원. 서버에서 수동 편집 금지, PR로 수정.
# 사용: docker compose -f docker-compose.ocr.yml --env-file .env.ocr up -d
# CD는 ocr-worker만 bounce: ... up -d --no-deps ocr-worker
# 인프라(ollama)는 최초 1회 full up 후 restart 정책으로 상주 + 모델 pull 1회 필요.
#
# 전제: 호스트에 NVIDIA 드라이버 + nvidia-container-toolkit 설치됨(Deep Learning AMI 권장).
name: brbs-ocr

services:
  # 로컬 LLM/임베딩 서빙. backend EC2의 report/chatbot이 GPU_PRIVATE_IP:11434로 호출.
  ollama:
    image: ollama/ollama:latest
    container_name: brbs-ollama
    restart: unless-stopped
    ports:
      # backend EC2가 호출 → private IP 바인딩(무인증이므로 SG로만 sg-backend 허용). 0.0.0.0 금지.
      - "${GPU_PRIVATE_IP}:11434:11434"
    volumes:
      - ollama-models:/root/.ollama   # gemma3:12b(~7GB)+bge-m3(~2GB) 캐시. 최초 pull 필요.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [ocr-net]

  # OCR Worker(surya, in-process PyTorch). SQS ocr-job-queue 소비 → 결과 저장 → 리포트 이벤트 발행.
  ocr-worker:
    image: ${ECR_REGISTRY}/soma/ocr:${OCR_TAG:-dev}
    container_name: brbs-ocr-worker
    restart: unless-stopped
    environment:
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}                       # RDS 직접
      # RDS는 SSL 연결만 허용(pg_hba). 비우면 core.db가 SSL을 꺼(평문) "no encryption"으로 거부됨.
      RDS_CA_PATH: ${RDS_CA_PATH}                          # 컨테이너 내부 CA 경로(아래 볼륨과 일치)
      SQS_OCR_JOB_QUEUE_URL: ${SQS_OCR_JOB_QUEUE_URL}        # 소비 큐 전체 URL(AWS SQS)
      SQS_REPORT_JOB_QUEUE_URL: ${SQS_REPORT_JOB_QUEUE_URL}  # 발행 큐 전체 URL
      # SQS_ENDPOINT_URL은 실 AWS에선 주입하지 않는다(기본 엔드포인트). 자격증명은
      # EC2 인스턴스 프로파일(IAM Role) — 정적 키 없음. 튜닝 변수(SQS_WAIT_TIME_SECONDS 등)는
      # 코드 기본값을 쓰므로 생략한다.
      EMBEDDING_BASE_URL: http://ollama:11434/v1          # 같은 박스 내부
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      # 하이브리드 표 문서 보조 경로(ocr_worker.vlm_client). Ollama 네이티브
      # /api/generate라 EMBEDDING_BASE_URL과 달리 /v1 접미사 없음. 모델은 최초
      # 1회 `docker exec brbs-ollama ollama pull <모델>` 필요.
      VLM_BASE_URL: http://ollama:11434
      # 표 전사(텍스트만) — 팀 합의 모델. 실측: 텍스트 정확도·속도 모두 8B보다 좋음.
      VLM_MODEL: ${VLM_MODEL:-qwen3.6:35b-a3b}
      # 이미지 마스킹 보강용 PII 위치 grounding(좌표) 전용 — 실측: 표 전사엔 더 좋은
      # 위 모델도 grounding 좌표는 실제 위치를 벗어남(과소 마스킹 위험) — 검증된
      # 모델을 별도 고정한다. VLM_MODEL과 다른 값을 쓰려면 이 변수를 바꾼다.
      VLM_GROUNDING_MODEL: ${VLM_GROUNDING_MODEL:-qwen3-vl:8b-instruct}
      VLM_TIMEOUT_SECONDS: ${VLM_TIMEOUT_SECONDS:-60}
      # 명시하지 않으면 ollama 기본 num_ctx가 페이지 이미지 토큰만으로 대부분 차, 표가
      # 많은 문서에서 응답이 에러 없이 문장 중간에서 잘렸다(실측 확인).
      VLM_NUM_CTX: ${VLM_NUM_CTX:-16384}
      # 이름(NAME) 마스킹은 정규식 문맥 앵커(의사명·서명란)만으로는 "환자의 성명: OOO"
      # 같은 일반 라벨-값 형태를 못 잡는다 — 실측(E2E) 확인. NER이 유일한 방어선이라
      # 기본 활성화한다(CPU 추론, 모델은 최초 detect 시 lazy 다운로드).
      USE_NER: ${USE_NER:-true}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      TZ: Asia/Seoul
    volumes:
      # RDS CA 번들(호스트에 배치, git 미커밋)을 읽기전용 마운트. RDS_CA_PATH가 이 경로를 가리킨다.
      # 준비: curl -o /opt/ocr/certs/rds-global-bundle.pem \
      #        https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
      - /opt/ocr/certs/rds-global-bundle.pem:/etc/ssl/rds/global-bundle.pem:ro
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [ocr-net]

  # ── 관측성 에이전트: 중앙 모니터링 인스턴스(brbs-monitoring, 10.0.11.48)가 원격 수집 ──
  # prometheus·grafana·loki·tempo는 그 모니터링 인스턴스에 상주한다(백엔드 레포 docker-compose.monitoring.yml).
  # 아래 넷은 "이 호스트(g6=brbs-ai)"를 감시/수집하는 에이전트라 여기 상주하며, 모니터링 인스턴스가
  # 원격으로 스크랩(node·cadvisor·dcgm)·수신(alloy→loki)한다. 노출은 보안그룹으로만 좁힌다
  # (모니터링 인스턴스 private IP發 인바운드만 허용, 외부 미노출). 0.0.0.0 게시라도 SG로 차단하는 게 팀 규약.
  # ⚠️ CD는 ocr-worker만 bounce(up -d --no-deps ocr-worker) → 이 에이전트들은 최초 1회 full `up -d` 필요(ollama와 동일).

  # 시스템 메트릭(CPU·메모리·디스크·네트워크). 모니터링 인스턴스가 9100으로 원격 스크랩.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: brbs-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [ocr-net]

  # 컨테이너 메트릭. 모니터링 인스턴스가 8080으로 원격 스크랩(prometheus.yml g6 스텁이 8080을 가리킴).
  # t3는 8080이 앱과 충돌해 8082를 쓰지만, g6엔 8080이 비어 있어 스텁대로 8080에 게시한다(의도된 분기).
  # v0.55.1: containerd 이미지 스토어(overlayfs) 호환 — 구버전 v0.49.x는 컨테이너 등록이 전멸한다.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: brbs-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [ocr-net]

  # GPU 메트릭(VRAM·util·온도·전력·SM clock). ollama/ocr-worker와 같은 GPU를 읽기전용으로 계측한다.
  # 모니터링 인스턴스가 9400으로 원격 스크랩. DCGM_FI_DEV_FB_USED/FREE 등으로 VRAM/OOM·스로틀링을 본다.
  # 드라이버 호환 문제 시 utkuozdemir/nvidia_gpu_exporter(nvidia-smi 기반, :9835)로 대체 가능(prometheus job 포트만 교체).
  # 멀티 GPU 박스면 count: 1 → count: all.
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
    container_name: brbs-dcgm-exporter
    restart: unless-stopped
    ports:
      - "9400:9400"
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [ocr-net]

  # 로그 수집: 이 호스트 전 컨테이너(ollama·ocr-worker·에이전트) stdout → 원격 Loki(모니터링 인스턴스)로 push.
  # docker.sock을 read-only로 마운트해 컨테이너를 발견하고 로그 스트림을 읽는다. config는 ./monitoring/alloy/config.alloy
  # (compose와 같은 디렉터리 기준 → 호스트 /opt/ocr/monitoring/alloy/config.alloy에 배치). 12345(자체 상태)도
  # 모니터링 인스턴스 Prometheus가 alloy job으로 원격 스크랩한다.
  # ⚠️ docker.sock을 이미지 기본 사용자로 못 읽으면 `user: root` 또는 `group_add: [docker]` 추가.
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: brbs-alloy
    restart: unless-stopped
    ports:
      - "12345:12345"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 128m
    mem_reservation: 64m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [ocr-net]

volumes:
  ollama-models:
  alloy-data:

networks:
  ocr-net:
    driver: bridge

