[project]
name = "ai-engine"
version = "0.1.0"
description = "보험·법률 AI 처리 엔진 (OCR Worker·Hybrid RAG·LangGraph 리포트·가드레일·챗봇)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiokafka>=0.11",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "redis>=5.0",
    "ollama>=0.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "kiwipiepy>=0.23.2",
]

[project.optional-dependencies]
# OCR Worker (GPU 노드). paddlepaddle-gpu는 Linux+CUDA 전용 —
# 로컬(mac/CPU)에선 'paddlepaddle'로 바꾸거나 ocr extra 설치를 생략
ocr = [
    "paddleocr>=2.7",
    "paddlepaddle-gpu>=2.6",
    #"paddlepaddle=3.3.1"
    "pymupdf>=1.24",
]
# LangGraph 멀티에이전트 리포트 생성
report = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
# 챗봇 (FastAPI WebSocket 직결, 비스트리밍)
chatbot = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "python-jose[cryptography]>=3.3",
]
# 임베딩 폴백 (BGE-M3). torch 포함 — 무겁고 플랫폼 의존적.
embeddings = [
    "sentence-transformers>=3.0",
]
# PII 탐지 보조 NER. 실행 시 torch 필요(배포 이미지에서 플랫폼별로 설치).
ner = [
    "transformers>=4.42",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.uv]
# src 코드 작성 단계에서 package = true + build-system으로 전환한다.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 테스트에서 assert 허용

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
