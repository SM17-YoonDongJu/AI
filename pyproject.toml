[project]
name = "ai-engine"
version = "0.1.0"
description = "보험·법률 AI 처리 엔진 (OCR Worker·Hybrid RAG·LangGraph 리포트·가드레일·챗봇)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiokafka>=0.11",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "redis>=5.0",
    "ollama>=0.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "kiwipiepy>=0.23.2",
]

[project.optional-dependencies]
# OCR Worker (GPU 노드). surya-ocr는 PyTorch 기반 전용 OCR 엔진.
# 0.17.x는 FoundationPredictor로 in-process(워커 내 라이브러리 로드) 실행 —
# 0.18+는 별도 추론 서버(vllm/llama.cpp)가 필요하므로 in-process 세대로 고정한다.
# (로컬 CPU/Windows 개발 환경엔 미설치 — 엔진/렌더/S3는 lazy import로 격리한다.)
ocr = [
    "surya-ocr>=0.17,<0.18",
    "pymupdf>=1.24",   # PDF → 페이지 이미지 렌더
    "pillow>=10.0",    # surya 입력(PIL.Image)
    "boto3>=1.34",     # S3 GetObject(원본 다운로드)
]
# LangGraph 멀티에이전트 리포트 생성
report = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
# 챗봇 (FastAPI WebSocket 직결, 비스트리밍)
chatbot = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "python-jose[cryptography]>=3.3",
]
# 임베딩 폴백 (BGE-M3). torch 포함 — 무겁고 플랫폼 의존적.
embeddings = [
    "sentence-transformers>=3.0",
]
# PII 탐지 보조 NER. 실행 시 torch 필요(배포 이미지에서 플랫폼별로 설치).
ner = [
    "transformers>=4.42",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.uv]
# src 코드 작성 단계에서 package = true + build-system으로 전환한다.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 테스트에서 assert 허용
# 이관된 실험 리포트 그래프(P2). 프롬프트·주석 위주 장문(E501/RUF003), 자립 RAG의
# 즉시-await 클로저(B023)·내부상수 SQL(S608)은 안전 — 정밀 정리는 후속 리라이트에서.
"src/report_worker/nodes/agents.py" = ["E501", "RUF003", "SIM117"]
"src/report_worker/state.py" = ["E501"]
# 동적 검색 SQL: 테이블·컬럼은 내부 상수(_NS_TABLE/_NS_COLS), 사용자 값은 $N 파라미터 바인딩만.
"src/rag/search.py" = ["S608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

# 선택 의존성(extra)은 dev 환경에 미설치 → stub 없음. lazy import라 런타임엔 무관.
[[tool.mypy.overrides]]
module = [
    "transformers",
    "transformers.*",
    "surya.*",
    "fitz",
    "boto3",
    "botocore.*",
    "PIL.*",
    "asyncpg",
    "aiokafka",
    "aiokafka.*",
]
ignore_missing_imports = true
