# Deploy Prod — dev→main PR이 머지되면(main push) 테스트 → 이미지 빌드·ECR push → prod 반영.
#
# 백엔드 deploy-prod.yml과 같은 흐름이다. 승인은 main 브랜치 보호(PR 승인 1명·test 통과, 관리자도 예외
# 없음)가 건다 — GitHub은 PR 작성자가 자기 PR을 승인하지 못하게 하므로 교차 승인이 된다. 이미지는 main
# 커밋에서 다시 빌드한다.
#
#   ocr    : 전용 EC2(brbs-ocr-prod)에 SSM으로 반영한다 — compose를 레포 내용으로 덮고 OCR_TAG를 이번 sha7로.
#   report : 이미지(:<sha7>·:prod)를 올리고 Parameter Store /brbs/prod/env/REPORT_TAG만 갱신한다. report는
#            백엔드 prod 호스트 compose에서 돌고, 다시 띄우는 건 백엔드 쪽(sync-env.sh → up -d report)이 한다.
#
# 롤백은 main에 revert PR을 머지한다(같은 경로로 이전 코드가 다시 나간다). 재시도는 Run workflow(main).
# Environment `prod`는 main에서 온 실행만 받는다. 인프라·운영 절차는 deploy/prod/README.md.
name: Deploy Prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  EC2_INSTANCE_NAME: brbs-ocr-prod
  HOST_DIR: /opt/ocr
  REPORT_TAG_PARAM: /brbs/prod/env/REPORT_TAG

jobs:
  # 1) 테스트 게이트 — dev 배포와 같은 ci.yml을 재사용한다. 실패하면 빌드·배포가 시작되지 않는다.
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # 2) 빌드 — main 커밋에서 두 이미지를 다시 빌드한다. 한쪽이라도 실패하면 아무것도 배포하지 않는다.
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { service: ocr, dockerfile: src/ocr_worker/Dockerfile, repo: brbs/ocr }
          - { service: report, dockerfile: src/report_worker/Dockerfile, repo: brbs/report }
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: v
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # :<sha7> = 불변(배포·롤백 기준) / :prod = 가변(백엔드 prod 이미지와 같은 관례).
      # GHA 캐시는 브랜치별이라 dev 캐시를 main에서 못 쓴다 — 첫 main 빌드만 오래 걸린다.
      - name: Build & push (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ matrix.repo }}:${{ steps.v.outputs.sha7 }}
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ matrix.repo }}:prod
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=prod-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.service }}

      - name: Notify build failure
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_CI_FAILURES }}
          status: failure
          service: ${{ matrix.service }}
          environment: prod
          failed_step: build

  # 3-a) OCR — 전용 EC2에 반영한다.
  deploy-ocr:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: v
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Name 태그로 찾는다(백엔드 deploy-prod.yml과 같은 방식) — 스팟 stop→start에도 ID 변수가 필요 없다.
      - name: Find prod OCR instance
        id: inst
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$EC2_INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "::error::running 상태의 $EC2_INSTANCE_NAME 인스턴스가 없습니다(스팟 회수로 stopped일 수 있음)."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        env:
          INSTANCE: ${{ steps.inst.outputs.id }}
          TAG: ${{ steps.v.outputs.sha7 }}
          REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          COMPOSE_B64=$(base64 -w0 deploy/prod/docker-compose.ocr.yml)
          # 이 heredoc은 러너에서 변수($HOST_DIR·$TAG 등)를 채운 뒤 호스트로 보낸다. \$로 적은 부분만
          # 호스트에서 평가된다.
          CMD=$(cat <<EOF
          set -euo pipefail
          cd $HOST_DIR
          # compose는 레포가 진실원 — 서버에서 고친 내용이 있어도 덮는다.
          echo "$COMPOSE_B64" | base64 -d > docker-compose.ocr.yml
          # 배포 태그를 .env.ocr에 남겨 둔다. 스팟 stop→start나 수동 up에도 같은 이미지로 뜬다.
          if grep -q '^OCR_TAG=' .env.ocr; then
            sed -i 's/^OCR_TAG=.*/OCR_TAG=$TAG/' .env.ocr
          else
            echo 'OCR_TAG=$TAG' >> .env.ocr
          fi
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY
          docker compose -f docker-compose.ocr.yml --env-file .env.ocr pull ocr-worker
          docker compose -f docker-compose.ocr.yml --env-file .env.ocr up -d ocr-worker
          # 기동 직후 죽는 경우(env 누락·DB 권한·마이그레이션 오류)를 배포 실패로 드러낸다.
          # 마이그레이션·DB 풀 생성까지 끝날 시간을 준 뒤 재시작 없이 떠 있는지 본다.
          sleep 45
          STATE=\$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' brbs-ocr-worker)
          echo "container: \$STATE"
          docker logs --tail 30 brbs-ocr-worker
          [ "\$STATE" = "running 0" ]
          docker image prune -f
          EOF
          )
          # 스크립트 전체를 base64로 감싸 보낸다 — 따옴표·특수문자가 --parameters JSON을 깨지 않게.
          B64=$(printf '%s' "$CMD" | base64 -w0)
          printf '{"commands":["echo %s | base64 -d | bash"],"executionTimeout":["900"]}' "$B64" > /tmp/ssm-params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ocr $TAG to prod" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId=$CMD_ID"
          # 큰 이미지(paddle 모델 포함) pull이 기본 waiter(~100초)를 넘기므로 직접 폴링한다(최대 12분).
          STATUS=Pending
          for i in $(seq 1 72); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success | Failed | Cancelled | TimedOut) break ;;
            esac
            echo "SSM $STATUS ... ($i/72)"
            sleep 10
          done
          echo "SSM Status=$STATUS"
          echo "----- SSM StandardOutput (host, tail) -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text 2>/dev/null | tail -40
          if [ "$STATUS" != "Success" ]; then
            echo "----- SSM StandardError (host) -----"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
              --query StandardErrorContent --output text 2>/dev/null | tail -50
            exit 1
          fi

      - name: Notify deploy result
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ job.status == 'success' && secrets.DISCORD_WEBHOOK_DEPLOYMENT || secrets.DISCORD_WEBHOOK_CI_FAILURES }}
          status: ${{ job.status }}
          service: ocr
          environment: prod
          image_tag: brbs/ocr:${{ steps.v.outputs.sha7 }}

  # 3-b) report — 이미지 태그만 넘긴다. 실제 재기동은 백엔드 prod 호스트 쪽 몫이다.
  report-tag:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: v
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 백엔드 sync-env.sh가 /brbs/prod/env/를 읽어 .env.prod를 만든다 — 이 값만 바꾸면 다음 sync 때 반영된다.
      - name: Update REPORT_TAG
        env:
          TAG: ${{ steps.v.outputs.sha7 }}
        run: |
          aws ssm put-parameter --name "$REPORT_TAG_PARAM" --type String --value "$TAG" --overwrite \
            --query Version --output text
          {
            echo "### report 이미지 brbs/report:$TAG"
            echo "\`$REPORT_TAG_PARAM\`을 \`$TAG\`로 갱신했습니다. 백엔드 prod 호스트(/home/ubuntu/backend)에서"
            echo "\`sudo bash sync-env.sh && docker compose --env-file .env.prod up -d report\`로 반영합니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify result
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ job.status == 'success' && secrets.DISCORD_WEBHOOK_DEPLOYMENT || secrets.DISCORD_WEBHOOK_CI_FAILURES }}
          status: ${{ job.status }}
          service: report
          environment: prod
          image_tag: brbs/report:${{ steps.v.outputs.sha7 }} (REPORT_TAG 갱신 — 백엔드 호스트 재기동 필요)
