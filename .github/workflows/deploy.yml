# Deploy — dev push(=병합) 시 테스트 통과 후 변경된 서비스만 ECR 빌드→push→배포.
# 배포 경로:
#   - report·corpus·ocr: k8s — K8s-manifests의 image.tag를 이번 커밋 sha7로 커밋하면
#     Argo CD가 감지해 다시 띄운다. CI는 클러스터·서버에 접속하지 않는다.
#     ocr은 brbs-etl 노드의 ocr-worker Deployment다(K8s-manifests charts/ocr-worker).
#   - SSM 경로(GPU EC2 호스트 compose)는 지금 쓰는 서비스가 없다. ocr을 GPU EC2로 되돌릴 때를
#     위해 남겨 둔다 — matrix의 manifest를 비우면 그 경로로 간다.
# 테스트는 ci.yml을 workflow_call로 재사용해 게이팅한다(needs: test). 워크플로 간 needs는
# 불가하므로 "재사용 호출"로 잇는다. push 직접 트리거라 workflow_run의 기본브랜치 제약도 없다.
#
# prod는 별도 워크플로(deploy-prod.yml)다 — dev→main PR 머지(main push)로 돈다. 배포 대상(전용 EC2·
# 백엔드 호스트)과 승인(main 브랜치 보호)이 dev와 달라 이 파일에 분기로 넣지 않았다.
name: Deploy

on:
  push:
    branches: [dev]
  # paths-filter와 무관하게 이미지를 다시 올려야 할 때 쓴다(ECR 재구축·계정 이전처럼
  # 코드는 그대로인데 레지스트리가 비어 있는 경우). 빌드 대상은 services 입력으로 고른다.
  workflow_dispatch:
    inputs:
      services:
        description: "빌드할 서비스(쉼표 구분: ocr,corpus,report). 비우면 전부."
        required: false
        default: ""

jobs:
  # 1) 테스트 게이트 — ci.yml 재사용. 실패하면 아래 잡들은 시작되지 않는다.
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # 2) 변경 감지 — 빌드할 서비스 목록(JSON matrix)을 만든다.
  #    공용 코드(core/pyproject/uv.lock) 변경 시 3개 전부 재빌드.
  changes:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          # 현재 브랜치의 "이 push 이전 커밋"과 비교한다(dev push↔dev, main push↔main).
          # base 미지정 시 기본 브랜치(main)와 비교돼 dev의 거의 모든 파일이 변경으로 잡힌다.
          base: ${{ github.ref_name }}
          filters: |
            shared: ['pyproject.toml','uv.lock','src/core/**']
            ocr: ['src/ocr_worker/**','migrations/ai/**']
            corpus: ['src/corpus_worker/**','migrations/corpus/**']
            # guardrail.mask_pii가 OCR 마스킹 규칙(ocr_worker.masking과 그 import 체인)을 그대로 쓴다.
            # 규칙만 바뀌어도 report가 다시 배포돼야 두 워커의 마스킹이 갈라지지 않는다.
            # report 이미지도 migrations/ai를 싣고 기동 시 적용한다(GPU EC2가 꺼져도 자기 테이블 보장).
            report: ['src/report_worker/**','src/rag/**','src/guardrail/**','migrations/ai/**','src/ocr_worker/masking/**','src/ocr_worker/__init__.py','src/ocr_worker/ocr.py','src/ocr_worker/storage.py']
      - id: set
        shell: bash
        run: |
          # 빌드 대상 판정 — 양쪽 경로를 "쉼표로 구분한 서비스 목록"(sel) 하나로 모으고,
          # pick이 그 목록만 본다. 수동 실행은 services 입력, push는 paths-filter 결과를 쓴다.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sel=$(echo "${{ inputs.services }}" | tr -d ' ')
            [ -n "$sel" ] || sel="ocr,corpus,report"
          else
            # paths-filter의 changes는 걸린 필터 이름 배열이다(예: ["shared","report"]).
            sel=$(echo '${{ steps.filter.outputs.changes }}' | tr -d '[]" ')
            # 공용 코드가 걸리면 서비스 필터와 무관하게 전부 다시 빌드한다.
            case ",$sel," in *,shared,*) sel="ocr,corpus,report" ;; esac
          fi
          echo "selected: ${sel:-<none>}"
          pick() { case ",$sel," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }

          items=()
          add() { items+=("$1"); }
          # entry: service|dockerfile|repo|tag|target|svc|compose_src|manifest
          # 서비스별 전용 저장소(brbs/ocr·brbs/corpus·brbs/report)에 :dev·:<sha7> 태그로 push한다.
          # manifest: K8s-manifests의 값 파일 경로. 비어 있지 않으면 Argo CD 경로(매니페스트 태그 커밋),
          #   비어 있으면 SSM 경로(target=ocr: GPU EC2)로 배포한다. 지금은 셋 다 Argo CD 경로다.
          # compose_src: SSM 배포 시 호스트에 기록할 "레포 내" compose(우리 소유라 코드 기반).
          pick ocr     && add '{"service":"ocr","dockerfile":"src/ocr_worker/Dockerfile","repo":"brbs/ocr","tag":"dev","target":"k8s","svc":"ocr-worker","compose_src":"","manifest":"envs/dev/ocr-worker.values.yaml"}'
          pick corpus  && add '{"service":"corpus","dockerfile":"src/corpus_worker/Dockerfile","repo":"brbs/corpus","tag":"dev","target":"k8s","svc":"corpus-worker","compose_src":"","manifest":"envs/dev/etl-corpus.values.yaml"}'
          pick report  && add '{"service":"report","dockerfile":"src/report_worker/Dockerfile","repo":"brbs/report","tag":"dev","target":"k8s","svc":"report","compose_src":"","manifest":"envs/dev/report.values.yaml"}'
          json=$(IFS=,; echo "[${items[*]}]")
          echo "matrix={\"include\":$json}" >> "$GITHUB_OUTPUT"
          echo "will build: $json"

  # 3) 빌드→push→배포 (서비스별 병렬). 변경분 존재 시에만.
  #    배포는 matrix.manifest 유무로 갈린다: 있으면 K8s-manifests 태그 커밋(Argo CD), 없으면 SSM.
  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: v
        shell: bash
        run: echo "sha7=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # :dev = 가변(latest, SSM compose가 pull) / :<sha7> = 불변(커밋별). k8s 매니페스트는 :<sha7>만 쓴다
          # (이름이 그대로인 :dev는 매니페스트가 안 바뀌어 Argo CD가 반영하지 않는다).
          tags: |
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ matrix.repo }}:${{ matrix.tag }}
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ matrix.repo }}:${{ steps.v.outputs.sha7 }}
          # 부팅 로그에 찍어 새 이미지가 실제로 떴는지 확인한다.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # ── Argo CD 경로 (report·corpus) ──────────────────────────────────────────────
      # 클러스터에 직접 배포하지 않고 K8s-manifests의 dev 이미지 태그만 바꿔 커밋한다.
      # 실제 반영(Sync·롤링 재시작)은 Argo CD가 레포를 보고 3분 안에 한다.
      # brbs-manifests-ci 앱 토큰. K8s-manifests 한 레포의 contents 쓰기로만 범위를 좁힌다.
      - name: Create GitHub App token
        id: app-token
        if: matrix.manifest != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MANIFESTS_CI_CLIENT_ID }}
          private-key: ${{ secrets.MANIFESTS_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: K8s-manifests
          permission-contents: write

      - name: Checkout K8s-manifests
        if: matrix.manifest != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/K8s-manifests
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: manifests

      - name: Commit dev image tag (${{ matrix.service }})
        if: matrix.manifest != ''
        working-directory: manifests
        env:
          SHORT_SHA: ${{ steps.v.outputs.sha7 }}
          SERVICE: ${{ matrix.service }}
          VALUES_FILE: ${{ matrix.manifest }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          # 0809509처럼 숫자로만 된 해시는 따옴표가 없으면 YAML이 숫자로 읽어 이미지 주소가 깨진다.
          yq -i '.image.tag = strenv(SHORT_SHA) | .image.tag style="double"' "$VALUES_FILE"
          # 청크 뷰어(Policy-Chunker)는 운영 검색 코드를 report 이미지에서 받는다(K8s-manifests
          # charts/chunk-viewer의 aiEngine.tag). report 태그와 같은 커밋에서 같이 올려야 뷰어가 운영과
          # 같은 코드로 검색한다. 키가 있는 값 파일만 고친다 — 없는 키를 만들면 차트 쪽 변경과 겹친다.
          VIEWER_VALUES_FILE="$(dirname "$VALUES_FILE")/chunk-viewer.values.yaml"
          if [ "$SERVICE" = report ] && [ -f "$VIEWER_VALUES_FILE" ] \
              && yq -e 'has("aiEngine")' "$VIEWER_VALUES_FILE" > /dev/null 2>&1; then
            yq -i '.aiEngine.tag = strenv(SHORT_SHA) | .aiEngine.tag style="double"' "$VIEWER_VALUES_FILE"
          fi
          if git diff --quiet; then
            echo "이미 $SHORT_SHA 태그라 커밋하지 않습니다."
            exit 0
          fi

          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "chore(dev): ${SERVICE} 이미지를 ${SHORT_SHA}로 갱신" \
            -m "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            -m "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # report·corpus가 matrix로 동시에 돌고 백엔드 CI도 같은 main에 push한다. 파일이 달라 내용
          # 충돌은 없지만 push 순서 경합이 생기므로, 거절되면 최신 main 위로 다시 올려서 재시도한다.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 실패(${attempt}/3) — 최신 main 위로 다시 올립니다."
            git pull --rebase origin main
          done
          echo "::error::K8s-manifests main에 push하지 못했습니다."
          exit 1

      # ── SSM 경로 (GPU EC2 호스트 compose) ──────────────────────────────────────────
      # 지금은 이 경로를 타는 서비스가 없다(ocr도 위 Argo CD 경로로 옮겼다). ocr을 GPU EC2로 되돌릴 때
      # matrix의 ocr 항목을 target=ocr·compose_src·빈 manifest로 바꾸면 다시 이 경로로 간다.
      - name: Resolve deploy target
        id: t
        if: matrix.manifest == ''
        shell: bash
        run: |
          if [ "${{ matrix.target }}" != "ocr" ]; then
            echo "::error::SSM 배포 대상이 아닌 target입니다: ${{ matrix.target }}"
            exit 1
          fi
          # 대상 호스트가 아직 없는 구간(계정 이전 직후 등)에는 이미지만 올리고 배포를 건너뛴다.
          # 변수를 비워두는 것이 "호스트 미구축" 신호다 — 빈 instance-ids로 send-command를
          # 호출하면 알아보기 어려운 ValidationException으로 죽는다.
          if [ -z "${{ vars.OCR_EC2_INSTANCE_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::vars.OCR_EC2_INSTANCE_ID가 비어 있어 SSM 배포를 건너뜁니다(이미지 push는 완료)."
            exit 0
          fi
          echo "instance=${{ vars.OCR_EC2_INSTANCE_ID }}" >> "$GITHUB_OUTPUT"
          echo "compose=/opt/ocr/docker-compose.ocr.yml" >> "$GITHUB_OUTPUT"
          echo "envfile=/opt/ocr/.env.ocr" >> "$GITHUB_OUTPUT"

      # 레포의 compose를 base64로 인코딩(있을 때만). SSM으로 호스트 파일을 이 내용으로 덮는다.
      # compose_src가 비면 건너뛴다 → 호스트 파일 그대로 사용.
      - name: Encode compose from repo
        id: cmp
        if: matrix.manifest == '' && steps.t.outputs.skip != 'true'
        shell: bash
        run: |
          src="${{ matrix.compose_src }}"
          if [ -n "$src" ] && [ -f "$src" ]; then
            echo "b64=$(base64 -w0 "$src")" >> "$GITHUB_OUTPUT"
          else
            echo "b64=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSM (${{ matrix.svc }})
        if: matrix.manifest == '' && steps.t.outputs.skip != 'true'
        shell: bash
        run: |
          CMD=$(cat <<EOF
          set -e
          cd \$(dirname ${{ steps.t.outputs.compose }})
          # compose를 레포 기준으로 갱신(base64 전달분이 있을 때만). 서버 수동편집 대신 코드가 진실원.
          if [ -n "${{ steps.cmp.outputs.b64 }}" ]; then
            echo "${{ steps.cmp.outputs.b64 }}" | base64 -d > ${{ steps.t.outputs.compose }}
          fi
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REGISTRY }}
          docker compose -f ${{ steps.t.outputs.compose }} --env-file ${{ steps.t.outputs.envfile }} pull ${{ matrix.svc }}
          docker compose -f ${{ steps.t.outputs.compose }} --env-file ${{ steps.t.outputs.envfile }} up -d --no-deps ${{ matrix.svc }}
          docker image prune -f
          EOF
          )
          # 스크립트 전체를 base64로 감싸 전달한다. compose 기록 블록의 따옴표·콤마가 base64 안으로
          # 들어가므로, --parameters(shorthand/JSON) 파싱이 특수문자로 깨지지 않는다.
          B64=$(printf '%s' "$CMD" | base64 -w0)
          printf '{"commands":["echo %s | base64 -d | bash"]}' "$B64" > /tmp/ssm-params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.t.outputs.instance }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ matrix.svc }} ${{ github.sha }}" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId=$CMD_ID"
          # 기본 waiter(약 100초)는 큰 이미지(OCR=torch/surya) pull 도중 InProgress로 끝나
          # 배포가 진행 중인데도 실패로 처리됐다 → 최대 12분까지 상태를 직접 폴링한다.
          INSTANCE="${{ steps.t.outputs.instance }}"
          STATUS=Pending
          for i in $(seq 1 72); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success | Failed | Cancelled | TimedOut) break ;;
            esac
            echo "SSM $STATUS ... ($i/72)"
            sleep 10
          done
          echo "SSM Status=$STATUS"
          if [ "$STATUS" != "Success" ]; then
            # 호스트에서 왜 실패했는지 드러낸다(compose·이미지·env 문제 진단).
            echo "----- SSM StandardError (host) -----"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query StandardErrorContent --output text 2>/dev/null | tail -50
            echo "----- SSM StandardOutput (host, tail) -----"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query StandardOutputContent --output text 2>/dev/null | tail -30
            exit 1
          fi

      # Argo CD 경로(report·corpus·ocr)는 실패할 때만 알린다. 이 잡의 성공은 매니페스트 커밋까지라서,
      # 실제 반영 결과(배포 완료·Sync 실패·Degraded)는 Argo CD가 DEPLOYMENT 채널로 보낸다(K8s-manifests PR #11).
      - name: Notify deploy result
        if: always() && (matrix.manifest == '' || job.status != 'success')
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ job.status == 'success' && secrets.DISCORD_WEBHOOK_DEPLOYMENT || secrets.DISCORD_WEBHOOK_CI_FAILURES }}
          status: ${{ job.status }}
          service: ${{ matrix.service }}
          image_tag: ${{ matrix.manifest != '' && format('{0}:{1}', matrix.repo, steps.v.outputs.sha7) || format('{0}:{1}', matrix.repo, matrix.tag) }}
