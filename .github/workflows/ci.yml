# CI — dev push / PR 시 lint(ruff) + 테스트(pytest). 백엔드 ci.yml의 파이썬 판이다.
name: CI

on:
  push:
    # dev 상시 + 기능 브랜치 push도 CI 검증(워크플로가 dev에 병합되기 전까지 PR 자체 검증용).
    branches: [dev, "13-feature-ocr-worker-구현"]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_engine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_engine"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_engine
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps (dev)
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Pytest
        run: uv run pytest -q

      - name: Notify failure
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_CI_FAILURES }}
          status: failure
          service: ci

      - name: Notify success
        if: success() && github.event_name == 'push'
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_CI_BUILDS }}
          status: success
          service: ci
