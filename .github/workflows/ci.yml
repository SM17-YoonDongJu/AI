# CI/CD(dev) — dev PR/push 시 lint(ruff)+테스트(pytest). dev push(=병합) 성공 시
# 변경된 서비스만 ECR 빌드→push→SSM 배포까지 한 워크플로에서 test→deploy로 잇는다.
#
# 왜 통합했나: 배포를 별도 파일 + workflow_run으로 두면 그 워크플로는 저장소 "기본
# 브랜치(main)"에 있어야만 트리거된다(GitHub 제약). 워크플로가 dev에만 올라가는
# 현 구조에선 dev 병합으로 CD가 안 붙는다 → test→deploy를 한 워크플로 needs로 잇는다.
name: CI/CD Dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  # 1) 테스트 — PR·push 공통. deploy의 전제(needs)다. 실패하면 배포는 시작되지 않는다.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_engine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_engine"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_engine
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps (dev)
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Pytest
        run: uv run pytest -q

      - name: Notify failure
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_CI_FAILURES }}
          status: failure
          service: ci

      - name: Notify success
        if: success() && github.event_name == 'push'
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_CI_BUILDS }}
          status: success
          service: ci

  # 2) 변경 감지 — dev push 한정. 빌드할 서비스 목록(JSON matrix)을 만든다.
  #    공용 코드(core/pyproject/uv.lock) 변경 시 3개 전부 재빌드.
  changes:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: ['pyproject.toml','uv.lock','src/core/**']
            ocr: ['src/ocr_worker/**']
            report: ['src/report_worker/**','src/rag/**','src/guardrail/**']
            chatbot: ['src/chatbot/**','src/rag/**','src/guardrail/**']
      - id: set
        shell: bash
        run: |
          shared='${{ steps.filter.outputs.shared }}'
          items=()
          add() { items+=("$1"); }
          # entry: service|dockerfile|ecr_repo|target|compose_svc
          [ "$shared" = "true" ] || [ "${{ steps.filter.outputs.ocr }}" = "true" ]     && add '{"service":"ocr","dockerfile":"src/ocr_worker/Dockerfile","repo":"soma/ocr","target":"ocr","svc":"ocr-worker"}'
          [ "$shared" = "true" ] || [ "${{ steps.filter.outputs.report }}" = "true" ]  && add '{"service":"report","dockerfile":"src/report_worker/Dockerfile","repo":"soma/report","target":"backend","svc":"report"}'
          [ "$shared" = "true" ] || [ "${{ steps.filter.outputs.chatbot }}" = "true" ] && add '{"service":"chatbot","dockerfile":"src/chatbot/Dockerfile","repo":"soma/chatbot","target":"backend","svc":"chatbot"}'
          json=$(IFS=,; echo "[${items[*]}]")
          echo "matrix={\"include\":$json}" >> "$GITHUB_OUTPUT"
          echo "will build: $json"

  # 3) 빌드→push→SSM 배포 (서비스별 병렬). dev push + 변경분 존재 시에만.
  deploy:
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ matrix.repo }}:dev
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ matrix.repo }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # 대상 EC2/compose 경로를 target에 따라 결정
      - name: Resolve deploy target
        id: t
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "ocr" ]; then
            echo "instance=${{ vars.OCR_EC2_INSTANCE_ID }}" >> "$GITHUB_OUTPUT"
            echo "compose=/opt/ocr/docker-compose.ocr.yml" >> "$GITHUB_OUTPUT"
            echo "envfile=/opt/ocr/.env.ocr" >> "$GITHUB_OUTPUT"
          else
            echo "instance=${{ vars.BACKEND_EC2_INSTANCE_ID }}" >> "$GITHUB_OUTPUT"
            echo "compose=/home/ubuntu/backend/docker-compose.yml" >> "$GITHUB_OUTPUT"
            echo "envfile=/home/ubuntu/backend/.env.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSM (${{ matrix.svc }})
        shell: bash
        run: |
          CMD=$(cat <<EOF
          set -e
          cd \$(dirname ${{ steps.t.outputs.compose }})
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REGISTRY }}
          docker compose -f ${{ steps.t.outputs.compose }} --env-file ${{ steps.t.outputs.envfile }} pull ${{ matrix.svc }}
          docker compose -f ${{ steps.t.outputs.compose }} --env-file ${{ steps.t.outputs.envfile }} up -d --no-deps ${{ matrix.svc }}
          docker image prune -f
          EOF
          )
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.t.outputs.instance }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ matrix.svc }} ${{ github.sha }}" \
            --parameters commands="$CMD" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId=$CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ steps.t.outputs.instance }}" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ steps.t.outputs.instance }}" --query Status --output text)
          echo "SSM Status=$STATUS"
          [ "$STATUS" = "Success" ]

      - name: Notify deploy result
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ job.status == 'success' && secrets.DISCORD_WEBHOOK_DEPLOYMENT || secrets.DISCORD_WEBHOOK_CI_FAILURES }}
          status: ${{ job.status }}
          service: ${{ matrix.service }}
          image_tag: ${{ github.sha }}
